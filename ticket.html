<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Comprobante | Dr. Chulo</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

    <link
        rel="stylesheet"
        href="css/bloque4.css"
    >

</head>

<body>

    <header class="encabezado no-imprimir">

        <div class="contenedor navegacion">

            <a
                href="index.html"
                class="logo"
            >
                <span>DR.</span> CHULO
            </a>

            <nav>

                <ul class="menu">

                    <li>
                        <a href="perfil.html">
                            Mi cuenta
                        </a>
                    </li>

                    <li>
                        <a href="historial.html">
                            Mis compras
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main>

        <section class="pagina">

            <div class="contenedor ticket-contenedor">

                <article
                    id="ticket-compra"
                    class="ticket"
                >
                </article>


                <div class="ticket-acciones no-imprimir">

                    <button
                        type="button"
                        id="imprimir-ticket"
                        class="boton boton-principal"
                    >
                        Imprimir / guardar PDF
                    </button>


                    <a
                        href="historial.html"
                        class="boton boton-secundario"
                    >
                        Volver a mis compras
                    </a>

                </div>

            </div>

        </section>

    </main>


    <script src="js/bloque4.js"></script>

</body>

</html>
