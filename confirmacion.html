<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Compra confirmada | Dr. Chulo</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

    <link
        rel="stylesheet"
        href="css/bloque4.css"
    >

</head>

<body>

    <header class="encabezado">

        <div class="contenedor navegacion">

            <a
                href="index.html"
                class="logo"
            >
                <span>DR.</span> CHULO
            </a>

            <nav>

                <ul class="menu">

                    <li>
                        <a href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="catalogo.html">
                            Catálogo
                        </a>
                    </li>

                    <li>
                        <a href="perfil.html">
                            Mi cuenta
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main>

        <section class="pagina">

            <div class="contenedor">

                <div class="pago-aprobado">

                    <div class="pago-icono">
                        ✓
                    </div>

                    <p class="etiqueta">
                        COMPRA COMPLETADA
                    </p>

                    <h1>
                        Pago aprobado
                    </h1>

                    <p>
                        Tu compra se registró correctamente.
                    </p>


                    <div
                        id="confirmacion-pedido"
                        class="confirmacion-pedido"
                    >
                    </div>


                    <div class="checkout-acciones centro">

                        <a
                            href="ticket.html"
                            id="ver-ticket-confirmacion"
                            class="boton boton-principal"
                        >
                            Ver comprobante
                        </a>

                        <a
                            href="historial.html"
                            class="boton boton-secundario"
                        >
                            Mis compras
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="js/app.js"></script>
    <script src="js/bloque4.js"></script>

</body>

</html>
