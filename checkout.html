<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finalizar compra | Dr. Chulo</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

</head>

<body>

    <header class="encabezado">

        <div class="contenedor navegacion">

            <a
                href="index.html"
                class="logo"
            >
                <span>DR.</span> CHULO
            </a>

            <nav>

                <ul class="menu">

                    <li>
                        <a href="index.html">
                            Inicio
                        </a>
                    </li>

                    <li>
                        <a href="catalogo.html">
                            Catálogo
                        </a>
                    </li>

                    <li>
                        <a href="nosotros.html">
                            Nosotros
                        </a>
                    </li>

                    <li>
                        <a href="contacto.html">
                            Contacto
                        </a>
                    </li>

                    <li>
                        <a
                            href="login.html"
                            class="boton-login"
                        >
                            Iniciar sesión
                        </a>
                    </li>

                </ul>

            </nav>

        </div>

    </header>


    <main>

        <section class="pagina">

            <div class="contenedor">

                <div class="encabezado-pagina">

                    <p class="etiqueta">
                        COMPRA
                    </p>

                    <h1>
                        Finalizar compra
                    </h1>

                    <p>
                        Revisa el resumen de los servicios
                        seleccionados.
                    </p>

                </div>


                <div class="checkout-contenido">

                    <div class="checkout-tarjeta">

                        <h2>
                            Resumen del pedido
                        </h2>


                        <div id="checkout-productos">
                        </div>


                        <div class="checkout-total">

                            <span>
                                Total
                            </span>

                            <strong id="checkout-total">
                                $0
                            </strong>

                        </div>


                        <a
                            href="carrito.html"
                            class="boton boton-secundario"
                        >
                            Regresar al carrito
                        </a>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <footer class="pie">

        <div class="contenedor contenido-pie">

            <p>
                © 2026 Dr. Chulo - Detallado Automotriz
            </p>

            <p>
                Detallado automotriz a domicilio · Aguascalientes
            </p>

        </div>

    </footer>


    <script src="js/app.js"></script>

</body>

</html>
