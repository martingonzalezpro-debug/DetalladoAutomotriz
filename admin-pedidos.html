<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pedidos | Administración Dr. Chulo</title>

    <link
        rel="stylesheet"
        href="css/estilos.css"
    >

    <link
        rel="stylesheet"
        href="css/admin.css"
    >

    <link
        rel="stylesheet"
        href="css/admin-panel.css"
    >

</head>

<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">

            <div class="admin-logo">
                <span>DR.</span> CHULO
            </div>


            <nav class="admin-menu">

                <a href="admin.html">
                    Inicio
                </a>

                <a href="admin-productos.html">
                    Productos
                </a>

                <a
                    href="admin-pedidos.html"
                    class="activo"
                >
                    Pedidos
                </a>

                <a href="admin-promociones.html">
                    Promociones y cupones
                </a>

            </nav>


            <a
                href="index.html"
                class="admin-salir"
            >
                Cerrar administración
            </a>

        </aside>


        <main class="admin-main">

            <div class="admin-encabezado">

                <div>

                    <p class="etiqueta">
                        ADMINISTRACIÓN
                    </p>

                    <h1>
                        Gestión de pedidos
                    </h1>

                    <p>
                        Consulta y modifica los pedidos registrados.
                    </p>

                </div>


                <button
                    type="button"
                    id="admin-nuevo-pedido"
                    class="boton boton-principal"
                >
                    Agregar pedido
                </button>

            </div>


            <section
                id="admin-formulario-pedido"
                class="admin-formulario"
            >

                <h2 id="admin-titulo-pedido">
                    Agregar pedido
                </h2>


                <form
                    id="admin-pedido-form"
                    novalidate
                >

                    <input
                        type="hidden"
                        id="admin-pedido-id"
                    >


                    <div class="admin-formulario-grid">

                        <div class="campo">

                            <label for="admin-pedido-cliente">
                                Cliente
                            </label>

                            <input
                                type="text"
                                id="admin-pedido-cliente"
                                placeholder="Nombre del cliente"
                            >

                        </div>


                        <div class="campo">

                            <label for="admin-pedido-telefono">
                                Teléfono
                            </label>

                            <input
                                type="text"
                                id="admin-pedido-telefono"
                                placeholder="Teléfono"
                            >

                        </div>


                        <div class="campo campo-completo">

                            <label for="admin-pedido-servicios">
                                Servicios
                            </label>

                            <textarea
                                id="admin-pedido-servicios"
                                rows="3"
                                placeholder="Servicios del pedido"
                            ></textarea>

                        </div>


                        <div class="campo">

                            <label for="admin-pedido-total">
                                Total
                            </label>

                            <input
                                type="text"
                                id="admin-pedido-total"
                                placeholder="Total"
                            >

                        </div>


                        <div class="campo">

                            <label for="admin-pedido-pago">
                                Método de pago
                            </label>

                            <select id="admin-pedido-pago">

                                <option value="Tarjeta">
                                    Tarjeta
                                </option>

                                <option value="Transferencia bancaria">
                                    Transferencia bancaria
                                </option>

                                <option value="E-wallet">
                                    E-wallet
                                </option>

                                <option value="Efectivo">
                                    Efectivo
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label for="admin-pedido-estado">
                                Estado
                            </label>

                            <select id="admin-pedido-estado">

                                <option value="Pendiente">
                                    Pendiente
                                </option>

                                <option value="Pago aprobado">
                                    Pago aprobado
                                </option>

                                <option value="En proceso">
                                    En proceso
                                </option>

                                <option value="Terminado">
                                    Terminado
                                </option>

                                <option value="Cancelado">
                                    Cancelado
                                </option>

                            </select>

                        </div>


                        <div class="campo">

                            <label for="admin-pedido-fecha">
                                Fecha
                            </label>

                            <input
                                type="text"
                                id="admin-pedido-fecha"
                                placeholder="Fecha"
                            >

                        </div>

                    </div>


                    <div class="admin-formulario-botones">

                        <button
                            type="submit"
                            class="boton boton-principal"
                        >
                            Guardar
                        </button>


                        <button
                            type="button"
                            id="admin-cancelar-pedido"
                            class="boton boton-secundario"
                        >
                            Cancelar
                        </button>

                    </div>

                </form>

            </section>


            <section class="admin-seccion">

                <div class="admin-seccion-cabecera">

                    <div>

                        <p class="etiqueta">
                            PEDIDOS
                        </p>

                        <h2>
                            Todos los pedidos
                        </h2>

                    </div>

                </div>


                <div class="admin-tabla-responsive">

                    <table class="admin-tabla">

                        <thead>

                            <tr>

                                <th>
                                    Pedido
                                </th>

                                <th>
                                    Cliente
                                </th>

                                <th>
                                    Servicios
                                </th>

                                <th>
                                    Total
                                </th>

                                <th>
                                    Pago
                                </th>

                                <th>
                                    Estado
                                </th>

                                <th>
                                    Acciones
                                </th>

                            </tr>

                        </thead>


                        <tbody id="admin-tabla-pedidos">
                        </tbody>

                    </table>

                </div>

            </section>

        </main>

    </div>


    <script src="js/admin-panel.js"></script>

</body>

</html>
